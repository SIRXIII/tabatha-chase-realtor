        - generic [ref=e204]:
          - listitem [ref=e205]:
            - blockquote [ref=e206]: My wife Patti and I, have been privileged to be involved with multiple transactions with Kim Bibb. Years ago, when considering purchasing a beach house, and before we knew anything about The Peninsula Point, we met Kim one Sunday afternoon, she was holding an open house for one of her listings. Subsequent to that initial meeting, we've been on both sides of transactions with her representation; we bought, we sold, and we purchased again. She handled all transactions professionally as she represented us as buyers and/or as sellers. She also performed a successful leasing function and has advised us toward a convenient summer rental. Kim has wonderful...
            - text: — Chuck & Patti S.
          - listitem [ref=e207]:
            - blockquote [ref=e208]: Kim Bibb represented us (as well as the seller) in the successful purchase of a home on the Balboa Peninsula in 2014. Many of the critical steps in the process took place while we were on vacation out of the country and yet Kim and her colleague Tara Howarth helped us coordinate all the necessary paperwork, inspections, etc while we were away. They were always respectful of our interests and those of the seller and they were timely in their responses to our requests for information or help or access to the property. We ended up with a beautiful home at a fair price and managed to close escrow ahead of schedule.
            - text: — Bill
          - listitem [ref=e209]:
            - blockquote [ref=e210]: I have known Kim for almost 15 years. I have done 8 real estate transactions with Kim in that time. She has represented me both as a buyer and seller. What I appreciate in Kim is she knows and understands this real estate market. She is willing to wait until the timing is good to list or buy in order to achieve the best results for her clients. Kim will recommend and advise, but does not try to overpower the client. Kim seems to always be looking out to the future and wants a long lasting business relationship over a quick sale.
            - text: — Rick & Sue T.
      - link "VIEW ALL" [ref=e211] [cursor=pointer]:
