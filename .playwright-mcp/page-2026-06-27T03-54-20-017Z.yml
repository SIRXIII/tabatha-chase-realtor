    - generic [ref=e151]:
      - heading "Meet Kim" [level=2] [ref=e152]
      - generic [ref=e153]:
        - paragraph [ref=e154]:
          - strong [ref=e155]: "CA DRE #01210754"
        - paragraph [ref=e156]: As a top agent in Newport Beach, Kim Bibb is an unparalleled expert in the highly sought-after Balboa Peninsula Point submarket, where she has resided for 25+ years and transacted more than $1.5 billion in sales. An icon of luxury real estate throughout all of Newport Beach for over two decades, Kim has dominated its market by selling hundreds of elite coastal homes and setting new high-water marks for exceptional properties on the Oceanfront and Bayfront.
        - paragraph [ref=e157]: In addition to achieving many sales records, Kim is known for setting the gold standard in market intelligence and client service in coastal Orange County. Her success is a direct reflection of her hard work ethic, innovative marketing strategy, involvement in the community, loyalty to clients, and commitment to staying up to date on the ever-changing Newport Beach market. Her high-profile clientele often come back to her for future needs, knowing they can trust her and rely on her to find off-market opportunities and keep sales confidential when necessary. This is the primary reason that year over year, Kim Bibb remains a top agent in Newport Beach and all of California.
      - link "Learn More Meet Kim" [ref=e366] [cursor=pointer]:
        - /url: /meet-kim-bibb
        - text: Learn More
